name: Scrape MaxiZoo
on:
  workflow_dispatch:
    inputs:
      maxpages:
        description: "Nb de pages (2 = test, 40 = tout)"
        default: "2"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Scraper
        env:
          MAXPAGES: ${{ github.event.inputs.maxpages }}
        run: python scraper.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add maxizoo_nutrition.csv debug_maxizoo.txt || true
          git commit -m "maxizoo" || echo "rien"
          git push || echo "push ko"
      - name: Telechargement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxizoo
          path: |
            maxizoo_nutrition.csv
            debug_maxizoo.txt
